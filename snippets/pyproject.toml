# Environment for the examples outside the frametool package (Book 1).
# Not a distributable package: `uv sync` just installs what the scripts need.
[project]
name = "embedded-c-to-python-snippets"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "frametool",                 # the pure-Python package in ../frametool-py
    "pyserial>=3.5",             # Phase 7: serial ports
    "pyusb>=1.3",                # Phase 7: USB (needs libusb to find real devices)
    "python-can>=4.6",           # Phase 7: CAN bus
    "matplotlib>=3.11",          # Phase 7: static plots
    "numpy>=2",                  # Phase 7: arrays for the plots
    "plotly>=7.1",               # Phase 7: interactive HTML plots
    "psutil>=7.2",               # Phase 7: host and process monitoring
    "construct>=2.10",           # Phase 2: declarative binary formats
    "protobuf>=7.35.1",          # Phase 2; not older than the gencode in protobuf_demo/telemetry_pb2.py
    "smbus2>=0.5; sys_platform == 'linux'",    # Phase 7: I2C through /dev/i2c-N
    "spidev>=3.6; sys_platform == 'linux'",    # Phase 7: SPI through /dev/spidevN.M
    "gpiod>=2.2; sys_platform == 'linux'",     # Phase 7: GPIO through libgpiod 2.x (peripherals.py imports it only on a board)
    "pyelftools>=0.32",          # reserve material: read symbols and DWARF from an ELF file
    "pyocd>=0.45",               # reserve material: debug probe access
    "pylink-square>=1.7",        # reserve material: SEGGER J-Link RTT exceptions and enums
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.4", "pytest-cov>=7", "ruff>=0.6", "mypy>=1.11", "types-pyserial", "types-psutil", "hypothesis>=6.100", "grpcio-tools", "types-protobuf"]

[tool.uv]
package = false                  # scripts only; nothing to build or install from here

[tool.uv.sources]
frametool = { path = "../frametool-py", editable = true }

[tool.ruff]
line-length = 100
extend-exclude = ["protobuf_demo/*_pb2.py", "protobuf_demo/*_pb2.pyi"]   # generated by protoc

[tool.ruff.lint.per-file-ignores]
"idioms/*.py" = ["PLR1730", "SIM102", "SIM115"]   # the C-style versions are meant to look like C
"interpreter/pdb_demo.py" = ["T100"]               # the script exists to stop at breakpoint()
"interpreter/repl_replay.py" = ["SIM115"]          # the file object is the console's input for the whole run
"interpreter/legacy_clock.py" = ["DTZ003"]          # the deprecated call is the point of the demo
"kwargs_forwarding.py" = ["PLW1510"]               # check=True is in the merged defaults, not in the call

[tool.pytest.ini_options]
testpaths = ["extras", "hardware"]
timeout = 30            # pytest-timeout: a test that hangs fails after 30 s instead of for ever
